# version: '3.8'

services:
  chat:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    # postgres/redis가 healthy 상태가 될 때까지 대기 -- migration이 DB 준비 전에
    # 실행되는 걸 방지.
    depends_on:
      redis: 
        condition: service_healthy
      postgres: 
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: unless-stopped
    command: sh -c "cd backend && pnpm migration:run && node dist/main"
    environment:
      NODE_ENV: development
      RUNTIME_ENV: docker


  postgres:
    image: postgres:18
    env_file:
      - .env.docker
    # POSTGRES_USER/PASSWORD/DB는 .env.docker에 직접 설정돼 env_file로 컨테이너에
    # 전달됨 -- 호스트 env 보간 불필요
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      # postgres 18+이미지는 버전별 PGDATA(/var/lib/postgresql/<major>/docker)를 쓰고
      # 메이저 버전 업그레이드에도 살아남도록 상위 디렉터리 마운트를 권장함.
      - postgres:/var/lib/postgresql
    healthcheck:
      # 서버 헬스체크 명령
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      # 얼마나 자주 시작하는지
      interval: 5s
      # 얼마나 오래 기다리는지
      timeout: 5s
      # 몇 번째 시도까지
      retries: 10
      # 시작 유예 시간
      start_period: 5s


  redis:
    image: redis:alpine
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      # 컨테이너 재시작/다운에도 데이터 유지를 위해 볼륨 마운트.
      - redis:/data
    healthcheck:
      # 서버 헬스체크 명령
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      # 얼마나 자주 시작하는지
      interval: 5s
      # 얼마나 오래 기다리는지
      timeout: 5s
      # 몇 번째 시도까지
      retries: 10
      # 시작 유예 시간
      start_period: 5s


volumes:
  postgres:
  redis: