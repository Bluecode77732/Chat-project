# version: '3.8'

services:
  chat:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    # Can omit `depends_on:` since it doesn't have any using DB.
    depends_on:
      redis: 
        condition: service_healthy
      postgres: 
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: unless-stopped
    command: sh -c "cd backend && pnpm migration:run && node dist/main"
    environment:
      NODE_ENV: docker


  postgres:
    image: postgres:18
    env_file:
      - .env.local
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB are set directly in .env.local
    # and passed into the container via env_file — no host-env interpolation needed
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      # postgres 18+ images use a version-specific PGDATA (/var/lib/postgresql/<major>/docker)
      # and recommend mounting the parent dir so it survives major-version upgrades.
      - postgres:/var/lib/postgresql
    healthcheck:
      # Server health check command
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      # How often start in
      interval: 5s
      # Take a break for how long 
      timeout: 5s
      # try for Nth time(s)
      retries: 10
      # Start in
      start_period: 5s


  redis:
    image: redis:alpine
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      # Despite when server crash or down, this data location path connects data with Docker container to preserve data persistently.
      - redis:/data
    healthcheck:
      # Server health check command
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      # How often start in
      interval: 5s
      # Take a break for how long 
      timeout: 5s
      # try for Nth time(s)
      retries: 10
      # Start in
      start_period: 5s


volumes:
  postgres:
  # Do not synchronize the node_modules folder, by without writing the colon, 
  # for developing upon cleaner environment, not to sync with un-utilizable Operating Systems.
  redis: