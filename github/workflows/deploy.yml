name: Chat Project
on: 
  push: 
    branches: [main]
  
  jobs:
    deploy:
    deploy-on-railway:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      
    steps: 
      - name: Checkout Action Version
      - uses: actions/setup-node@v6

      - name: Set Up NodeJS
      - uses: actions/setup-node@v6
        with: 
          node-version: 24

      - name: Install Dependencies
      - run: npm i

      - name: Build Project
      - run: npm run build
      
      - name: Run Test
      - run: npm run Test

      - name: Deploy Project
      - uses: bervProject/railway-deploy@main
        env:
          RAILWAY_TOKEN: ${{secrets.RAILWAY_TOKEN}}
        with:
          service: "Chat-project"
