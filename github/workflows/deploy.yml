name: Chat Project CI/CD
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # 누락됨 - 필수

      - uses: pnpm/action-setup@v4       # 누락됨 - pnpm 쓰면 필수
        with:
          version: latest

      - uses: actions/setup-node@v4      # v6 존재안함
        with:
          node-version: 20               # 24 아직 불안정, 20 LTS 권장
          cache: pnpm

      - run: pnpm install
      - run: pnpm test

  deploy:                                # deploy-on-railway 콜론 문법 오류
    needs: test                          # 누락됨 - test 통과 후 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # 누락됨

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install
      - run: pnpm run build

      - uses: bervProject/railway-deploy@main
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          service: "Chat-project"