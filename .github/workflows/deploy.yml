name: Chat Project CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 -- check:changelog이 CHANGELOG.md를 전체 `git log`와
      # 대조함; 기본 얕은 클론이면 대조할 대상이 없어짐.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: head -30 pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend test
      - run: pnpm --filter admin lint
      - run: pnpm --filter admin test
      - run: pnpm check:adr
      - run: pnpm check:config
      - run: pnpm check:deps
      - run: pnpm check:changelog

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chatdb_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_e2e_pw
      DB_DATABASE: chatdb_e2e
      HASH_ROUNDS: 12
      REFRESH_TOKEN_SECRET: ${{ secrets.E2E_REFRESH_TOKEN_SECRET }}
      ACCESS_TOKEN_SECRET: ${{ secrets.E2E_ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET_EXPIRES_IN: 604800
      ACCESS_TOKEN_SECRET_EXPIRES_IN: 900
      REDIS_URL: redis://localhost:6379
      USER_CACHE_TTL_SEC: 300
      SESSION_TTL_SEC: 86400
      MESSAGE_CACHE_TTL_SEC: 300
      CORS_ORIGIN: http://localhost:5173
      GEMINI_API_KEY: ci-placeholder-not-called-in-e2e
      # 순차 실행되는 e2e 스펙이 60초 윈도우 내에 한 IP에서 10회 넘게 회원가입/로그인함
      # -- 여기서만 auth rate limit을 완화함, 프로덕션은 10 유지.
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: 10000
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build backend
        run: pnpm --filter backend build

      - name: Run migrations
        run: pnpm --filter backend migration:run

      - name: Run backend e2e tests
        run: pnpm --filter backend test:e2e

      - name: Start backend
        run: node backend/dist/main &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 3000; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Backend failed to start within timeout" >&2
          exit 1

      - name: Install Playwright browsers
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter frontend e2e
        env:
          CI: true

  admin-e2e:
    needs: test
    runs-on: ubuntu-latest
    # 아직 blocking 아님: 이 job은 GitHub Actions에서 실제로 완료된 적이 없음
    # (2026-07-17 Actions API로 확인 -- 기록상 실행 0건, e2e는 성공 사례 1건 확인됨과
    # 대조적). 확인된 성공 실행이 최소 1건 나오면 blocking으로 되돌릴 것.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chatdb_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_e2e_pw
      DB_DATABASE: chatdb_e2e
      HASH_ROUNDS: 12
      REFRESH_TOKEN_SECRET: ${{ secrets.E2E_REFRESH_TOKEN_SECRET }}
      ACCESS_TOKEN_SECRET: ${{ secrets.E2E_ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET_EXPIRES_IN: 604800
      ACCESS_TOKEN_SECRET_EXPIRES_IN: 900
      REDIS_URL: redis://localhost:6379
      USER_CACHE_TTL_SEC: 300
      SESSION_TTL_SEC: 86400
      MESSAGE_CACHE_TTL_SEC: 300
      # admin은 메인 프론트엔드(:5173)와 다른 origin(:5174)에서 실행됨.
      CORS_ORIGIN: http://localhost:5174
      GEMINI_API_KEY: ci-placeholder-not-called-in-e2e
      # e2e job과 같은 이유: 순차 실행되는 CI auth 폭주가 가드에 걸리지 않게 함.
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: 10000
      VITE_API_URL: http://localhost:3000
      # superadmin을 만드는 인앱 플로우가 없음 -- 이 DB는 job 종료 후 폐기되는
      # 임시 DB라 고정된 CI 전용 자격증명(실제 비밀값 아님)을 써도 안전함.
      E2E_SUPERADMIN_EMAIL: e2e-superadmin@ci.local
      E2E_SUPERADMIN_PASSWORD: ci-superadmin-pw-e2e
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build backend
        run: pnpm --filter backend build

      - name: Run migrations
        run: pnpm --filter backend migration:run

      - name: Start backend
        run: node backend/dist/main &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 3000; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Backend failed to start within timeout" >&2
          exit 1

      - name: Seed superadmin account
        run: pnpm --filter admin e2e:seed

      - name: Install Playwright browsers
        run: pnpm --filter admin exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter admin e2e
        env:
          CI: true

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install
      - run: pnpm --filter backend build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service "Chat-project"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
