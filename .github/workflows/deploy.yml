name: Chat Project CI/CD
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: head -30 pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --filter backend lint || true
      - run: pnpm --filter backend test
      - run: pnpm --filter admin lint || true
      - run: pnpm --filter admin test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install
      - run: pnpm --filter backend build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service "Chat-project"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
