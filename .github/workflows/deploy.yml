name: Chat Project CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 -- check:changelog compares CHANGELOG.md against the full
      # `git log`; the default shallow clone would leave it nothing to compare.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: head -30 pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend test
      - run: pnpm --filter admin lint
      - run: pnpm --filter admin test
      - run: pnpm check:adr
      - run: pnpm check:config
      - run: pnpm check:deps
      - run: pnpm check:changelog

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chatdb_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_e2e_pw
      DB_DATABASE: chatdb_e2e
      HASH_ROUNDS: 12
      REFRESH_TOKEN_SECRET: ${{ secrets.E2E_REFRESH_TOKEN_SECRET }}
      ACCESS_TOKEN_SECRET: ${{ secrets.E2E_ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET_EXPIRES_IN: 604800
      ACCESS_TOKEN_SECRET_EXPIRES_IN: 900
      REDIS_URL: redis://localhost:6379
      USER_CACHE_TTL_SEC: 300
      SESSION_TTL_SEC: 86400
      MESSAGE_CACHE_TTL_SEC: 300
      CORS_ORIGIN: http://localhost:5173
      GEMINI_API_KEY: ci-placeholder-not-called-in-e2e
      # The serial e2e specs register/sign in >10 times from one IP inside the
      # 60s window — relax the auth rate limit here, production keeps 10.
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: 10000
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build backend
        run: pnpm --filter backend build

      - name: Run migrations
        run: pnpm --filter backend migration:run

      - name: Run backend e2e tests
        run: pnpm --filter backend test:e2e

      - name: Start backend
        run: node backend/dist/main &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 3000; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Backend failed to start within timeout" >&2
          exit 1

      - name: Install Playwright browsers
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter frontend e2e
        env:
          CI: true

  admin-e2e:
    needs: test
    runs-on: ubuntu-latest
    # Not yet blocking: this job has never completed a real run in GitHub Actions
    # (checked via the Actions API on 2026-07-17 -- zero runs on record, unlike
    # e2e which has one confirmed success). Revert to blocking once it has at
    # least one confirmed successful run.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chatdb_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_e2e_pw
      DB_DATABASE: chatdb_e2e
      HASH_ROUNDS: 12
      REFRESH_TOKEN_SECRET: ${{ secrets.E2E_REFRESH_TOKEN_SECRET }}
      ACCESS_TOKEN_SECRET: ${{ secrets.E2E_ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET_EXPIRES_IN: 604800
      ACCESS_TOKEN_SECRET_EXPIRES_IN: 900
      REDIS_URL: redis://localhost:6379
      USER_CACHE_TTL_SEC: 300
      SESSION_TTL_SEC: 86400
      MESSAGE_CACHE_TTL_SEC: 300
      # Admin runs on a different origin (:5174) than the main frontend (:5173).
      CORS_ORIGIN: http://localhost:5174
      GEMINI_API_KEY: ci-placeholder-not-called-in-e2e
      # Same rationale as the e2e job: don't let serial CI auth bursts trip the guard.
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: 10000
      VITE_API_URL: http://localhost:3000
      # No in-app flow can create a superadmin — this DB is fresh and thrown away
      # after the job, so a fixed CI-only credential (not a real secret) is fine.
      E2E_SUPERADMIN_EMAIL: e2e-superadmin@ci.local
      E2E_SUPERADMIN_PASSWORD: ci-superadmin-pw-e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build backend
        run: pnpm --filter backend build

      - name: Run migrations
        run: pnpm --filter backend migration:run

      - name: Start backend
        run: node backend/dist/main &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 3000; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          echo "Backend failed to start within timeout" >&2
          exit 1

      - name: Seed superadmin account
        run: pnpm --filter admin e2e:seed

      - name: Install Playwright browsers
        run: pnpm --filter admin exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter admin e2e
        env:
          CI: true

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: pnpm install
      - run: pnpm --filter backend build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service "Chat-project"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
