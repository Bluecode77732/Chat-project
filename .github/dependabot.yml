version: 2
updates:
  # pnpm workspace: 루트의 항목 하나로 backend/, frontend/, admin/을 공유
  # pnpm-lock.yaml을 통해 전부 커버함 -- Dependabot이 여기서 모든 워크스페이스
  # 패키지를 해석하므로 패키지별 항목이 필요 없음.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
